name: "Deploy CF Workers"
description: "builds and deploys the gcsim workers to cloudflare. Assumes pnpm setup has already ran"
inputs:
  apiToken:
    required: true
    description: cloudflare api token
  accountId:
    required: true
    description: cloudflare account id
  rcloneConfig:
    required: true
    description: rclone config for cloudflare R2 (gcsim bucket static files)

runs:
  using: composite
  steps:
  # Run wrangler directly via pnpm rather than cloudflare/wrangler-action.
  # This is a pnpm workspace whose packages use the `workspace:` protocol.
  # wrangler-action shells out to `npm i wrangler@...` when it decides to
  # (re)install, and npm can't parse `workspace:` deps -> EUNSUPPORTEDPROTOCOL.
  # `pnpm install` (in the setup step) already installed the pinned wrangler,
  # so we just invoke it — matching how deploy-ui/db/docs drive the toolchain.
  # --keep-vars: don't wipe dashboard-managed vars (ASSET_SOURCE_HOSTS).
  - name: Deploy to Cloudflare Workers
    working-directory: ./ui/packages/workers
    shell: bash
    run: pnpm exec wrangler deploy --keep-vars
    env:
      CLOUDFLARE_API_TOKEN: ${{ inputs.apiToken }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.accountId }}

  # Provision/refresh the static files the worker serves from R2 (fonts, logo,
  # special/* traveler icons, misc/* including default.png). Sourced from the
  # workers package's own static/ copy so the package is self-contained. Uses
  # `copy` not `sync` so dynamically cached images already in the bucket survive.
  - name: Setup rclone
    uses: AnimMouse/setup-rclone@v1
    with:
      rclone_config: ${{ inputs.rcloneConfig }}
      disable_base64: true
  - name: Upload static assets to R2
    shell: bash
    run: rclone copy ./ui/packages/workers/static/ r2rclone:gcsim/ --progress
