name: "Build UI"
description: "builds the gcsim UI into ui/packages/web/dist for the consolidated Worker to upload as assets. Assumes pnpm setup has already ran"
inputs:
  branch:
    required: true
    description: name of the branch
  hide-kqm-db:
    required: false
    default: ""
    description: '"true" hides the KQM DB section on the homepage'

runs:
  using: composite
  steps:
  - name: Build UI
    working-directory: ./ui
    shell: bash
    run: pnpm build:web
    env:
      VITE_BRANCH: ${{ inputs.branch }}
      VITE_HIDE_KQM_DB: ${{ inputs.hide-kqm-db }}

  - name: List UI dist
    working-directory: ./ui/packages/web/dist
    shell: bash
    run: ls -lh
