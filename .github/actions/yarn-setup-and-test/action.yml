name: "Setup pnpm and Run Validation and Tests"
description: "runs pnpm setup and any desired pnpm lint and test commands (no build)"
# NOTE: directory still named `yarn-setup-and-test` for this PoC to limit churn
# across workflow files that reference it. Rename to `pnpm-setup-and-test` (and
# update references in tests.yml / deploy.yml / build-images.yaml) as cleanup.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.5.1
    - uses: actions/setup-node@v4
      with:
        node-version: '24.14.0'
        cache: pnpm
        cache-dependency-path: "ui/pnpm-lock.yaml"
    - name: Install
      working-directory: ./ui
      shell: bash
      run: pnpm install --frozen-lockfile
