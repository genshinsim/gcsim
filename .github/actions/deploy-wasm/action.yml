name: "Deploy WASM"
description: "builds and deploys the gcsim WASM binary to cloudflare R2"
inputs:
  rcloneConfig:
    required: true
    description: rclone config for cloudflare R2
  branch:
    required: true
    description: name of the branch
  shareKey:
    required: true
    description: "key for signing share results"

runs:
  using: composite
  steps:
  - name: Build WASM
    working-directory: ./cmd/wasm
    shell: bash
    run: ./build.sh -o ./dist/$GITHUB_SHA/main.wasm
    env:
      GCSIM_SHARE_KEY: ${{ inputs.shareKey }}

  # Go's wasm output uses saturating float-to-int conversions, sign-extension ops and mutable
  # globals, so wasm-opt must allow all of them or it rejects the module. Keep in sync with
  # WASM_OPT=ci in scripts/wasmbench/build.sh. If this step fails, main.wasm is left as the
  # unoptimized go build output and the deploy continues with it (see the next step).
  - name: Optimize WASM
    id: wasm-opt
    continue-on-error: true
    shell: bash
    env:
      BINARYEN_VERSION: version_133
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    run: |
      set -euo pipefail
      tarball="$RUNNER_TEMP/binaryen.tar.gz"
      # Retry so one transient failure doesn't block the deploy. --retry alone misses a 5xx served
      # over HTTP/2 when --fail is set (curl reports it as error 56), hence --retry-all-errors.
      curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors -o "$tarball" \
        "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
      echo "${BINARYEN_SHA256}  $tarball" | sha256sum -c -
      tar -xzf "$tarball" -C "$RUNNER_TEMP"
      wasm="cmd/wasm/dist/${GITHUB_SHA}/main.wasm"
      "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" \
        --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals \
        -Oz "$wasm" -o "$wasm.opt"
      ls -l "$wasm" "$wasm.opt"
      mv "$wasm.opt" "$wasm"

  - name: Fall back to unoptimized WASM
    if: steps.wasm-opt.outcome == 'failure'
    shell: bash
    run: |
      # Don't sync a partial wasm-opt output to R2.
      rm -f "cmd/wasm/dist/${GITHUB_SHA}/main.wasm.opt"
      echo "::warning title=wasm-opt failed::deploying the unoptimized wasm"

  - name: Upload to R2
    uses: AnimMouse/setup-rclone@v1 
    with:
      rclone_config: ${{ inputs.rcloneConfig }}
      disable_base64: true
  - name: sync
    shell: bash
    run: rclone sync ./cmd/wasm/dist/ r2rclone:wasm/${{ inputs.branch }}/ --progress 