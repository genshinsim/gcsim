packages:
  - "packages/*"

# Dependencies allowed to run install/build (lifecycle) scripts. pnpm v11 blocks
# these by default and, with strictDepBuilds on (default), FAILS the install
# (ERR_PNPM_IGNORED_BUILDS) if any are left unresolved. Each must be explicitly
# allowed (true) or denied (false).
allowBuilds:
  "@swc/core": true
  core-js: true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

# Fail the install on unmet peer dependencies (surfaces real version skew),
# EXCEPT the entries allowlisted below. Each waiver is a third-party package
# whose declared peer range is merely stale, or a known internal version skew;
# none is an actual runtime incompatibility. Verified by a from-scratch
# `pnpm install --strict-peer-dependencies` on 2026-09-11. Prefer fixing the
# underlying version over widening this list.
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # react-popper v1 predates React 18; range never updated. Works on 18.
    "react-popper>react": "18"
    # react-virtual v2 (old @tanstack/react-virtual) declares react 16/17 only.
    "react-virtual>react": "18"
    # tsconfck's declared typescript peer range predates the TS7 native
    # compiler; the monorepo standardizes on typescript@7. tsconfck's core
    # tsconfig parser is self-contained and does not need the peer. Runs on 7.
    "tsconfck>typescript": "7"
    # madge declares typescript as an OPTIONAL peer (used only by `pnpm
    # circular`/`orphans` dev tooling, not build/typecheck/CI). Its range
    # predates TS7; waived so the workspace's single typescript@7 satisfies it.
    "madge>typescript": "7"
