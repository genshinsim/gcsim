version: v2
# Uses buf's hosted remote plugins, so no local protoc / protoc-gen-go /
# protoc-gen-go-grpc / ts-proto binaries need to be installed to generate.
# Versions are pinned to match what last generated the committed output.
plugins:
  # Go messages. `module=` strips the module prefix from each file's go_package
  # so output lands at pkg/model, backend/pkg/services/*, matching the old
  # `--go_out=module=github.com/genshinsim/gcsim:.` behaviour.
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: .
    opt:
      - module=github.com/genshinsim/gcsim

  # gRPC service stubs (db, preview, share).
  - remote: buf.build/grpc/go:v1.6.2
    out: .
    opt:
      - module=github.com/genshinsim/gcsim

  # TypeScript for the UI. Same options as the old protoc invocation.
  - remote: buf.build/community/stephenh-ts-proto:v2.12.1
    out: ui/packages/types/src/generated
    opt:
      - useOptionals=all
      - snakeToCamel=json
      - useJsonName=true
      - esModuleInterop=true
      - outputIndex=true
