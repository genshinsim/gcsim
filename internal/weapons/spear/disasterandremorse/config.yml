talents:
  # After the equipping character uses an Elemental Skill, they gain "Path of Conflict"
  # for 17s, as well as "Unforgivable" and "Irreparable" for 3s each. This effect can
  # trigger once every 18s.
  # Unforgivable: Increases the equipping character's Normal Attack and Charged Attack
  # DMG by 40%.
  # Irreparable: Increases the equipping character's Elemental Skill and Elemental Burst
  # DMG by 40%.
  # While Path of Conflict is in effect, when the equipping character hits an opponent
  # with a Normal Attack or Charged Attack, Irreparable's duration will be increased
  # by 1s. When the equipping character hits an opponent with their Elemental Skill or
  # Elemental Burst, Unforgivable's duration will be increased by 1s. Each of the above
  # effects can be triggered once every 0.1s. When Path of Conflict ends or the equipping
  # character leaves the field, both Unforgivable and Irreparable will be removed.
  # Hexerei: Secret Rite: The above DMG boosts are increased by 75%.
  - _passive: passive#0 # 17
  - _passive: passive#1 # 3
  - _passive: passive#2 # [0.4 0.5 0.6 0.7 0.8]
  - _passive: passive#3 # [0.4 0.5 0.6 0.7 0.8]
  - _passive: passive#4 # 1
  - _passive: passive#5 # 0.75
  - _passive: passive#6 # 18
