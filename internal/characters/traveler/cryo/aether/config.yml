use: pipeline
kind: character
name: aethercryo

override:
  id: 10000005
  depot: 505

docs:
  frames:
    - count: https://docs.google.com/spreadsheets/d/186FpS4ckDENVY4U60xxgevJZj_vdyYWZroIa7P_yDr4/edit?usp=sharing
      count_credit: Kolibri#7675
      video: https://youtu.be/2LnpQIVIszY
      video_credit: Kolibri#7675

abilities:
  - name: default
    params:
      base_atk_buff: 0 for no +3 base atk, 1 (default) for +3 base atk. Set via '+params=[base_atk_buff=...]' in the char's line.
      skirk_story_buff: 0 for no buffs, 1 (default) for +7 base atk, +15 EM, +50 base HP. Set via '+params=[skirk_story_buff=...]' in the char's line.
      true_moon_story_buff: 0 for no buffs, 1 (default) for +10% CR, +20% DEF, +20% ER, +60 EM, +20% HP, +20% ATK, +20% CD and special CA. Set via '+params=[true_moon_story_buff=...]' in the char's line.

  - name: attack
    hitbox:
      - name: N1
        shape: Box
        center: Player
        box: [1.4, 2.2]
        hitlag: { time: 0.03, scale: 0.01, defense_halt: true }

      - name: N2
        shape: Circle
        center: Player
        offset: [0, 0.6]
        fan_angle: 180
        radius: 1.7
        hitlag: { time: 0.03, scale: 0.01, defense_halt: true }

      - name: N3
        shape: Box
        center: Player
        offset: [0, 0.4]
        box: [1.5, 2.2]
        hitlag: { time: 0.06, scale: 0.01, defense_halt: true }

      - name: N4
        shape: Circle
        center: Player
        offset: [0, 0.6]
        radius: 1.7
        hitlag: { time: 0.09, scale: 0.01, defense_halt: true }

      - name: N5
        shape: Circle
        center: Player
        offset: [0, 0.6]
        fan_angle: 240
        radius: 1.75
        hitlag: { time: 0.12, scale: 0.01, defense_halt: true }

  - name: charge
    note: Need to use attack right before charge.
    hitbox:
      - name: CA-1
        shape: Circle
        center: Player
        radius: 2.2

      - name: CA-2
        shape: Circle
        center: Player
        radius: 2.2

      - name: CA-Enhanced-1
        shape: Circle
        center: Player
        radius: 3.2
        offset: [0, 1]

      - name: CA-Enhanced-2
        shape: Circle
        center: Player
        radius: 3.2
        offset: [0, 1]

  - name: skill
    hitbox:
      - name: E
        shape: Circle
        center: Player
        fan_angle: 60
        radius: 8

      - name: E-FrostPierce
        shape: Circle
        center: PrimaryTarget
        radius: 1.2

  - name: burst
    hitbox:
      - name: Q
        shape: Circle
        center: PrimaryTarget
        offset: [0, -0.3]
        radius: 4.5
