      name: PlayerIce_ElementalArt_Icicle

shortcuts:
  - travelercryo

combat:
  icd_tags:
    - TravelerCryoIcicle
  icd_groups:
    - TravelerCryoIcicle

docs:
  frames:
    - count: https://docs.google.com/spreadsheets/d/1S7cJszsMoQF6ShCvA7hMjiXMuOCoDRwgW1rseP0uC8k/edit?usp=sharing
